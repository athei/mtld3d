name: prepare
description: Restore the shared caches and bring up exactly the toolchain one CI leg needs.

# Every leg is one `make` target, so this holds no build logic: it restores the
# caches the build job primed and then calls the `setup-*` leaves the Makefile
# already exposes. The inputs are what a leg needs, not what it is: a lint leg
# wants no Rosetta, and only the build leg saves the caches back. Test machines
# use the `runner` action instead: they replay a staged build and need no
# toolchain at all.
inputs:
  pe:
    description: >
      Leg builds for a PE target: needs the MSVC SDK splat, and the Wine SDK,
      since windows/shim links against Wine's import libraries and `winebuild`
      marks the built DLLs.
    default: 'false'
  wine:
    description: >
      Leg runs the PE binaries it built, so it needs Rosetta. Implies `pe`.
    default: 'false'
  wine-release:
    description: wine-build release tag to download on a cache miss. Read when `pe` is true.
    default: ''
  prime:
    description: >
      This is the build job: warm the cargo registry and save every cache it
      touched. The check job only ever restores.
    default: 'false'

runs:
  using: composite
  steps:
    # Mandatory for every `make` call (the Makefile hard-errors without it and
    # prepends $WINE_SDK/bin to PATH so wine, wineserver and winebuild resolve).
    # Under $HOME rather than the workspace: checkout's `git clean` would take
    # anything inside the workspace with it.
    - name: Point WINE_SDK at the extracted bundle
      shell: bash
      run: echo "WINE_SDK=$HOME/wine-sdk/wine" >> "$GITHUB_ENV"

    # The tools key is built from the pinned versions themselves rather than from
    # a hash of the file that carries them: editing a comment in ci.yml must not
    # throw away half a gigabyte of cache and recompile the tools from source.
    - name: Compute the tools cache key
      id: keys
      shell: bash
      run: |
        pins=$(printf '%s|%s|%s|%s' "$RUST_STABLE" "$RUST_NIGHTLY" "$CARGO_TOOLS" "$NEXTEST_VERSION" | shasum | cut -c1-16)
        echo "tools=tools-${{ runner.os }}-${{ runner.arch }}-$pins" >> "$GITHUB_OUTPUT"

    # Two caches, because the two halves of a cargo home change for different
    # reasons and one of them must never be restored partially.
    #
    # The ledger files (.crates.toml, .crates2.json) are cargo's record of which
    # crate owns which installed binary, and have to arrive with `bin`: without
    # them `cargo install` treats the restored binaries as strays and refuses to
    # proceed rather than skipping them. Hence no restore-keys here, since a
    # prefix fallback can hand back one without the other; a miss costs the setup
    # job one cold install and the other legs nothing.
    - name: Restore the toolchains and cargo tools
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.rustup
          ~/.cargo/bin
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
        key: ${{ steps.keys.outputs.tools }}

    # The crate registry is keyed on the lockfiles and a prefix fallback is right
    # here: a partial registry costs a fetch of what is missing, nothing more.
    - name: Restore the crate registry
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          registry-${{ runner.os }}-${{ runner.arch }}-

    # Skipped on a PE leg: `setup-xwin` below has it as a prerequisite, and it is
    # the one step that has to run after the splat cache lands, so running it here
    # too would just repeat the rustup and cargo-install checks.
    - name: Toolchains
      if: inputs.pe != 'true'
      shell: bash
      run: make setup-rust

    # /opt is root-owned, so the cache cannot restore into /opt/xwin until this
    # has created it and handed it to the runner user.
    - name: Claim /opt/xwin
      if: inputs.pe == 'true'
      shell: bash
      run: make xwin-dir

    - name: Restore the MSVC SDK splat
      uses: actions/cache/restore@v4
      if: inputs.pe == 'true'
      with:
        path: /opt/xwin
        key: xwin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
        restore-keys: |
          xwin-${{ runner.os }}-${{ runner.arch }}-

    # A no-op on a hit: the splat carries a stamp of what it holds, and the
    # Makefile pins the versions this compares against.
    - name: MSVC SDK
      if: inputs.pe == 'true'
      shell: bash
      run: make setup-xwin

    # The prebuilt nextest the unit tests run under, pinned by ci.yml; lands
    # in the cargo bin directory and so travels in the tools cache with the
    # toolchains.
    - name: nextest
      shell: bash
      run: make setup-nextest NEXTEST_VERSION="$NEXTEST_VERSION"

    - name: Restore the Wine SDK
      id: wine-cache
      uses: actions/cache/restore@v4
      if: inputs.pe == 'true'
      with:
        path: ~/wine-sdk
        key: wine-${{ runner.os }}-${{ runner.arch }}-${{ inputs.wine-release }}

    # The tarball unpacks to `wine/`, so this lands at $HOME/wine-sdk/wine, which
    # is what WINE_SDK points at above. `make install` writes our builtin into
    # this tree, which is why the legs restore it but never save it back.
    - name: Download the pinned Wine SDK
      if: inputs.pe == 'true' && steps.wine-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/wine-sdk"
        curl -fsSL -o "$RUNNER_TEMP/wine.tar.xz" \
          "https://github.com/athei/wine-build/releases/download/${{ inputs.wine-release }}/wine-${{ inputs.wine-release }}-macos-x86_64.tar.xz"
        tar -xJf "$RUNNER_TEMP/wine.tar.xz" -C "$HOME/wine-sdk"

    # The SDK is an x86_64 build and every PE it loads is x86 code.
    - name: Rosetta
      if: inputs.wine == 'true'
      shell: bash
      run: make setup-rosetta

    - name: Warm the cargo registry
      if: inputs.prime == 'true'
      shell: bash
      run: make fetch

    - name: Save the toolchains and cargo tools
      uses: actions/cache/save@v4
      if: inputs.prime == 'true'
      with:
        path: |
          ~/.rustup
          ~/.cargo/bin
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
        key: ${{ steps.keys.outputs.tools }}

    - name: Save the crate registry
      uses: actions/cache/save@v4
      if: inputs.prime == 'true'
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Save the MSVC SDK splat
      uses: actions/cache/save@v4
      if: inputs.prime == 'true' && inputs.pe == 'true'
      with:
        path: /opt/xwin
        key: xwin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

    - name: Save the Wine SDK
      uses: actions/cache/save@v4
      if: inputs.prime == 'true' && inputs.pe == 'true'
      with:
        path: ~/wine-sdk
        key: wine-${{ runner.os }}-${{ runner.arch }}-${{ inputs.wine-release }}
