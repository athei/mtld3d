name: runner
description: Bring up a test machine that replays a staged build, with no toolchain of its own.

# A test leg builds nothing: it takes the stage the build job packed and runs
# the suites against the pinned arm64 Wine. So this holds the Wine SDK and the
# unpacked stage, which carries the test binaries and both runners, and
# nothing else. The Makefile does the rest through `STAGE=`.
inputs:
  wine-release-arm64:
    description: Release tag (athei/mach9) of the arm64 Wine, downloaded on a cache miss.
    required: true

runs:
  using: composite
  steps:
    # Mandatory for every `make` call. Under $HOME rather than the workspace:
    # checkout's `git clean` would take anything inside the workspace with it.
    - name: Point WINE_SDK at the extracted bundle
      id: wine
      shell: bash
      run: |
        echo "WINE_SDK=$HOME/wine-sdk/wine" >> "$GITHUB_ENV"
        echo "STAGE=$RUNNER_TEMP/stage" >> "$GITHUB_ENV"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        tag='${{ inputs.wine-release-arm64 }}'
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "asset=wine-$tag-macos-arm64.tar.xz" >> "$GITHUB_OUTPUT"

    # The build job primes this cache, so a test leg downloads the bundle only
    # on a miss and saves it for the rest. `make install` writes our builtin
    # into the tree later in the job, so the save is its own step, right after
    # the download, and not the end-of-job save of `actions/cache`, which
    # would store the installed tree.
    - name: Restore the Wine SDK
      id: wine-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/wine-sdk
        key: wine-${{ runner.os }}-${{ runner.arch }}-${{ steps.wine.outputs.tag }}

    - name: Download the pinned Wine SDK
      if: steps.wine-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/wine-sdk"
        curl -fsSL -o "$RUNNER_TEMP/wine.tar.xz" \
          "https://github.com/athei/mach9/releases/download/${{ steps.wine.outputs.tag }}/${{ steps.wine.outputs.asset }}"
        tar -xJf "$RUNNER_TEMP/wine.tar.xz" -C "$HOME/wine-sdk"

    - name: Save the Wine SDK
      if: steps.wine-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/wine-sdk
        key: wine-${{ runner.os }}-${{ runner.arch }}-${{ steps.wine.outputs.tag }}

    - name: Download the staged build
      uses: actions/download-artifact@v8
      with:
        name: stage
        path: ${{ runner.temp }}

    - name: Unpack the staged build
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/stage"
        tar -xf "$RUNNER_TEMP/mtld3d-stage.tar" -C "$RUNNER_TEMP/stage"
