name: rerun-gpu-hangs

# A hosted runner whose GPU hangs stays hung for the rest of the machine's
# life, so a leg cut short that way has no verdict and the answer is the same
# job on a fresh machine, which a re-run of the failed jobs gives. The e2e and
# conformance steps of ci.yml mark such a leg with an error annotation titled
# `GPU hang` (see the comments above them). When a ci run fails and every job
# that did not succeed carries that annotation, this re-runs the failed jobs
# once. A run with any other failure is left alone, since a regression never
# ends that way, and so is a run's second attempt, whether this made it or
# someone did by hand: a GPU that hangs twice in a row is worth a look.
#
# A workflow_run workflow runs from the default branch, so a change here takes
# effect once it is on main. It reads the API and nothing of the run's code,
# so a fork's pull request gets the same treatment with no risk, and it needs
# no Mac.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  # The re-run, and the job list it is decided on.
  actions: write
  # The annotations, which live on each job's check run.
  checks: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A pull request's runs share a concurrency group that cancels the run
      # in progress, so re-running a run a newer push has replaced would
      # cancel the newer one; that run is left alone too.
      - name: Re-run the failed jobs when every one of them hung its GPU
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          failed=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/1/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "\(.id) \(.name)"')
          if [ -z "$failed" ]; then
            echo "run $RUN_ID failed with no failed job; nothing to re-run"
            exit 0
          fi
          while read -r id name; do
            hung=$(gh api --paginate "repos/$GH_REPO/check-runs/$id/annotations?per_page=100" \
              --jq '.[] | select(.title == "GPU hang") | .title')
            if [ -z "$hung" ]; then
              echo "$name did not end with a GPU hang, so run $RUN_ID is not re-run"
              exit 0
            fi
            echo "$name ended with a GPU hang"
          done <<<"$failed"
          if [ "$EVENT" = pull_request ]; then
            newest=$(gh run list --workflow ci.yml --event pull_request --branch "$BRANCH" \
              --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ "$newest" != "$RUN_ID" ]; then
              echo "run $newest has replaced run $RUN_ID on $BRANCH, so it is not re-run"
              exit 0
            fi
          fi
          gh run rerun "$RUN_ID" --failed
          echo "Re-ran the failed jobs of run $RUN_ID, every one of which hung its runner's GPU, on fresh machines." >> "$GITHUB_STEP_SUMMARY"
