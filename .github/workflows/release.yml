name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tag pushes are not tied to a branch; only draft releases for tags
      # whose commit is reachable from main.
      - name: Verify the tag points into main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # The tag and both workspace versions have to agree. The release identity
      # every DLL logs on load comes from the tag (`git describe`), the fallback
      # identity from the manifest, so a disagreement means a shipped binary
      # names a version that is not the one being released.
      - name: Verify the tag matches the manifest version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for ws in windows unix; do
            got=$(sed -n 's/^version = "\(.*\)"/\1/p' "$ws/Cargo.toml")
            [ "$got" = "$expected" ] || {
              echo "$ws/Cargo.toml version $got does not match tag $GITHUB_REF_NAME" >&2
              exit 1
            }
          done

      # Artifacts (mtld3d.tar.xz and mtld3d-debug.tar.xz from `make bundle`) are
      # uploaded manually onto the draft before publishing.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
