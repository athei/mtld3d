name: ci

on:
  push:
    branches: [main]
  pull_request:
  # So a branch can be run through the whole matrix before it has a PR, or
  # only through the runner probe at the bottom.
  workflow_dispatch:
    inputs:
      probe_only:
        description: Run only the probe-metal job.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One bucket per ref, so a second push to a PR cancels the fan-out already
  # grinding on the commit it superseded. Not on main: every commit there gets a
  # complete, attributable result rather than a cancelled one. A probe-only
  # dispatch has its own bucket, so it neither waits for nor displaces a full
  # run of the same branch.
  group: ci-${{ github.ref }}-${{ inputs.probe_only && 'probe' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Everything a run depends on that is not in the tree is pinned here, so a green
# main cannot turn red without a commit: both toolchains, the one cargo tool a
# build needs, and the nextest binary every test machine replays the suites
# with. All are plain Makefile variables that float for a developer, and every
# cargo line in the Makefile names its toolchain with rustup's `+` syntax. The
# MSVC CRT and Windows SDK versions are pinned in the Makefile instead, beside
# the xwin call that consumes them.
env:
  WINE_RELEASE: cx-26.3.0-1
  RUST_STABLE: 1.97.1
  RUST_NIGHTLY: nightly-2026-08-18
  CARGO_TOOLS: xwin@0.10.0
  NEXTEST_VERSION: 0.9.143
  # The paravirtual GPU on a runner does not implement the counters the Metal HUD
  # samples, and says so on every launch. The validation layer keeps the
  # Makefile's default of on: it catches the misuse these legs exist to find.
  MTL_HUD_ENABLED: "0"

# The shape: two machines compile, everything else replays. `build` makes the
# stage every test leg installs and runs from, so the suites fan out over
# machines that carry no toolchain, the slow Intel image included, and no
# compile happens twice. `check` runs every lint, doc and unit leg as steps of
# one job, then builds the distribution bundle, since each of those is short and
# a machine per leg cost more in setup than in work.
jobs:
  # Everything a test machine needs, built once on the fast image: both PE
  # arches, both unix `.so` builds, the e2e suite as nextest archives, and the
  # conformance runner for both host arches. Primes the caches the check job
  # restores too.
  build:
    if: ${{ !inputs.probe_only }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # BUILD_ID, which names the build inside every binary, comes from
          # `git describe --tags`.
          fetch-tags: true
      - uses: ./.github/actions/prepare
        with:
          pe: 'true'
          wine: 'true'
          wine-release: ${{ env.WINE_RELEASE }}
          prime: 'true'
      - run: make stage
      - uses: actions/upload-artifact@v4
        with:
          name: stage
          path: windows/target/mtld3d-stage.tar
          retention-days: 3
          if-no-files-found: error

  # The gates that need a toolchain but no GPU, one step each so a red step
  # names itself, and every step runs whatever the ones before it did: a run
  # is meant to show everything that is wrong at once, not the first thing.
  # `pe` gates the MSVC SDK and the Wine SDK: clippy and rustdoc run build
  # scripts, so snmalloc-sys and zstd-sys need the xwin headers and the
  # archiver, and windows/shim's build script reads Wine's libwinecrt0.a. The
  # bundle comes last: built the way a release is, at the default PROD=1, so
  # the production profile's fat LTO is exercised here rather than first
  # failing when a release is cut.
  check:
    if: ${{ !inputs.probe_only }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
      - uses: ./.github/actions/prepare
        with:
          pe: 'true'
          wine-release: ${{ env.WINE_RELEASE }}
      - name: fmt-check
        run: make fmt-check
      - name: audit
        if: ${{ !cancelled() }}
        run: make audit
      - name: clippy-pe-i686
        if: ${{ !cancelled() }}
        run: make clippy-pe-i686
      - name: clippy-pe-x86_64
        if: ${{ !cancelled() }}
        run: make clippy-pe-x86_64
      - name: clippy-native
        if: ${{ !cancelled() }}
        run: make clippy-native
      - name: doc-windows
        if: ${{ !cancelled() }}
        run: make doc-windows
      - name: doc-unix
        if: ${{ !cancelled() }}
        run: make doc-unix
      - name: test-unit
        if: ${{ !cancelled() }}
        run: make test-unit
      - name: bundle
        if: ${{ !cancelled() }}
        run: make bundle

  # The end-to-end suite: the staged PE binaries, run by the pinned Wine
  # against a Metal device, one leg per image, PE arch and partition.
  #
  # Two images today: the newest macOS on arm64 and the oldest macOS mtld3d
  # supports on arm64. The Intel image, whose paravirtual device has no
  # unified memory, no packed 16-bit formats and a 256-byte linear texture
  # alignment, runs the real Intel/AMD code paths with the strict
  # Managed-memory semantics, and joins once the pinned Wine boots there: for
  # now it cannot boot a prefix (`could not load kernel32.dll, status
  # c0000135`, see the probe job), and a leg that waits out wineboot's timer
  # to fail is a machine wasted. When it joins it runs under `INTEL=1`: the
  # device already gives three of the four Intel answers, and the fourth,
  # 32-bit float filtering, is the one a real Intel/AMD Mac's driver denies
  # and this paravirtual device does not, so the forced key is what makes
  # the image stand in for the hardware. On an Apple-family image the forced
  # answers are a local tool (`make test INTEL=1`) and do not run here. Each
  # suite is split in three hash-sharded partitions, so three machines share
  # it. The older image is advisory until its first runs are read.
  e2e:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.runner != 'macos-26' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
        arch: [i686, x86_64]
        partition: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/runner
        with:
          wine-release: ${{ env.WINE_RELEASE }}
          nextest-version: ${{ env.NEXTEST_VERSION }}
      # The ci profile runs the suite serially and to completion; see
      # windows/.config/nextest.toml.
      - run: make test-e2e-${{ matrix.arch }} STAGE="$STAGE" PARTITION=${{ matrix.partition }} INTEL=${{ matrix.runner == 'macos-15-intel' && '1' || '' }}
        env:
          NEXTEST_PROFILE: ci

  # Wine's own d3d9_test.exe against our staged builtin, per-site counts diffed
  # against unix/conformance/baseline.txt. One arch per runner process, and not
  # part of `make test`: many subtests fail by design, so this gates on a
  # regression rather than on zero failures. The per-subtest budget is raised
  # from its 180 s default because the GPU here is paravirtual, and a subtest
  # killed for taking too long is reported as a crash.
  # This gates on the same baseline the local runs use, in both directions:
  # a count above its pin is a regression, a count below it is a stale
  # baseline (also fatal, see CONFORMANCE.md). The desktop-mode sites that
  # fail on a real Mac because macdrv rejects the tests' mode changes read
  # zero on this display; those carry the `ceiling` class, whose pin is a
  # cross-environment maximum. The older image runs the suite as an advisory
  # leg: the baseline carries no per-image entries yet, so its counts are
  # read from the artifact until they are recorded and triaged. The Intel
  # image waits on the prefix boot, as for the e2e legs above; when it joins
  # it runs the `intel` variant for the reason given there, and records under
  # the `<arch>+intel` baseline entries. On an Apple-family image that
  # variant (`make conformance-intel`) is a local tool and does not run here.
  conformance:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.runner != 'macos-26' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
        arch: [i686, x86_64]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/runner
        with:
          wine-release: ${{ env.WINE_RELEASE }}
          nextest-version: ${{ env.NEXTEST_VERSION }}
      - run: make conformance-${{ matrix.runner == 'macos-15-intel' && 'intel-' || '' }}${{ matrix.arch }} STAGE="$STAGE"
        env:
          MTLD3D_CONFORMANCE_TIMEOUT_SECS: "600"
          # Every subtest's full output, which is what carries the
          # `Got <actual>, expected <expected>` values behind each site. The
          # job's own log reduces to per-site counts, and counts alone cannot
          # say why this environment diverges.
          MTLD3D_CONFORMANCE_RAW_DIR: ${{ runner.temp }}/conformance-raw

      # `always()`, because a diverging run is exactly the one whose output is
      # worth reading, and the job reports failure whenever it diverges.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-raw-${{ matrix.runner }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/conformance-raw
          retention-days: 14
          if-no-files-found: error

  # Manual only: what a hosted macOS runner exposes to Metal, on every image
  # the matrices above use. The OS, the device, and the capability bits
  # mtld3d branches on, then a clear pass, the pinned Wine booting a prefix,
  # and the one texture format the Mac2 family lacks. Run it before adding a
  # runner label to the matrices, since an image without a Metal device
  # cannot run the e2e or conformance legs at all, and the newest arm64 image
  # is in the list as the reference every other row is read against.
  probe-metal:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Host
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.memsize
          xcodebuild -version || true
      - name: Displays and GPUs
        run: system_profiler SPDisplaysDataType || true
      - name: Metal device
        run: |
          cat > "$RUNNER_TEMP/probe.swift" <<'EOF'
          import Metal
          let all = MTLCopyAllDevices()
          print("MTLCopyAllDevices: \(all.count)")
          for d in all { print("  \(d.name)") }
          guard let d = MTLCreateSystemDefaultDevice() else {
              print("MTLCreateSystemDefaultDevice: nil")
              exit(3)
          }
          print("default device: \(d.name)")
          print("registryID: \(d.registryID)")
          print("hasUnifiedMemory: \(d.hasUnifiedMemory)")
          print("isLowPower: \(d.isLowPower) isHeadless: \(d.isHeadless) isRemovable: \(d.isRemovable)")
          print("supportsFamily apple2: \(d.supportsFamily(.apple2)) apple7: \(d.supportsFamily(.apple7)) mac2: \(d.supportsFamily(.mac2)) metal3: \(d.supportsFamily(.metal3))")
          print("supports32BitFloatFiltering: \(d.supports32BitFloatFiltering)")
          print("supports32BitMSAA: \(d.supports32BitMSAA)")
          print("minimumLinearTextureAlignment bgra8: \(d.minimumLinearTextureAlignment(for: .bgra8Unorm))")
          for n in [2, 4, 8] { print("supportsTextureSampleCount \(n): \(d.supportsTextureSampleCount(n))") }
          print("recommendedMaxWorkingSetSize: \(d.recommendedMaxWorkingSetSize)")
          print("maxBufferLength: \(d.maxBufferLength)")
          guard let queue = d.makeCommandQueue() else { print("makeCommandQueue: nil"); exit(4) }
          let desc = MTLTextureDescriptor.texture2DDescriptor(pixelFormat: .bgra8Unorm, width: 64, height: 64, mipmapped: false)
          desc.usage = [.shaderRead, .renderTarget]
          guard let tex = d.makeTexture(descriptor: desc) else { print("makeTexture bgra8: nil"); exit(5) }
          let managed = d.makeBuffer(length: 4096, options: [.storageModeManaged])
          print("managed buffer: \(managed != nil)")
          let sd = MTLSamplerDescriptor()
          sd.sAddressMode = .clampToBorderColor
          sd.tAddressMode = .clampToBorderColor
          sd.borderColor = .opaqueWhite
          print("border sampler: \(d.makeSamplerState(descriptor: sd) != nil)")
          let cb = queue.makeCommandBuffer()!
          let rp = MTLRenderPassDescriptor()
          rp.colorAttachments[0].texture = tex
          rp.colorAttachments[0].loadAction = .clear
          rp.colorAttachments[0].storeAction = .store
          rp.colorAttachments[0].clearColor = MTLClearColor(red: 1, green: 0, blue: 0, alpha: 1)
          let enc = cb.makeRenderCommandEncoder(descriptor: rp)!
          enc.endEncoding()
          // A Managed texture on a device without unified memory holds the
          // GPU's write in VRAM until a synchronize brings it across.
          let blit = cb.makeBlitCommandEncoder()!
          blit.synchronize(resource: tex)
          blit.endEncoding()
          cb.commit()
          cb.waitUntilCompleted()
          print("clear pass status: \(cb.status.rawValue) error: \(String(describing: cb.error))")
          var px = [UInt8](repeating: 0, count: 4)
          tex.getBytes(&px, bytesPerRow: 256, from: MTLRegionMake2D(0, 0, 1, 1), mipmapLevel: 0)
          print("pixel after clear (bgra): \(px)")
          EOF
          swift "$RUNNER_TEMP/probe.swift"
      # The pinned Wine bundle itself: the loader, a registry write that boots a
      # fresh prefix, and what the prefix holds afterwards, all unsilenced. The
      # environment is the Makefile's: without the mscoree/mshtml overrides a
      # fresh prefix tries to install Wine Mono and Gecko, which on a headless
      # machine waits out wineboot's five-minute boot timer.
      - name: Wine
        env:
          WINEDLLOVERRIDES: mscoree,mshtml=
          WINEMSYNC: "1"
          WINEDEBUG: "-all"
        run: |
          mkdir -p "$HOME/wine-sdk"
          curl -fsSL -o "$RUNNER_TEMP/wine.tar.xz" \
            "https://github.com/athei/wine-build/releases/download/${{ env.WINE_RELEASE }}/wine-${{ env.WINE_RELEASE }}-macos-x86_64.tar.xz"
          tar -xJf "$RUNNER_TEMP/wine.tar.xz" -C "$HOME/wine-sdk"
          W="$HOME/wine-sdk/wine/bin/wine"
          file "$W"
          "$W" --version || echo "wine --version exit $?"
          # What the bundle was built for and what this machine offers.
          otool -l "$HOME/wine-sdk/wine/lib/wine/x86_64-unix/ntdll.so" | grep -A4 'LC_BUILD_VERSION\|LC_VERSION_MIN' | head -12
          sysctl -n machdep.cpu.brand_string machdep.cpu.features machdep.cpu.leaf7_features 2>/dev/null || true
          ls "$HOME/wine-sdk/wine/lib/wine" | head
          ls "$HOME/wine-sdk/wine/lib/wine/x86_64-windows" | head -5
          # The prefix boot, with every process and module load, every exception
          # and the time of each, kept whole as an artifact; the errors and the
          # end of it inline.
          WINEDEBUG=+timestamp,+loaddll,+process,+seh,+winediag "$W" reg add 'HKCU\Software\Wine\Probe' /v x /t REG_SZ /d y /f > "$RUNNER_TEMP/wine-trace.log" 2>&1 || echo "reg add exit $?"
          echo "== errors, warnings, exceptions"
          grep -aE 'err:|warn:|seh:|winediag' "$RUNNER_TEMP/wine-trace.log" | head -60
          echo "== last lines"
          tail -60 "$RUNNER_TEMP/wine-trace.log"
          ls -la "$HOME/.wine" "$HOME/.wine/drive_c" "$HOME/.wine/drive_c/windows" 2>/dev/null || true
          "$HOME/wine-sdk/wine/bin/wineserver" -k || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wine-trace-${{ matrix.runner }}
          path: ${{ runner.temp }}/wine-trace.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Packed 16-bit texture (Apple-family only; expected to abort on Mac2)
        run: |
          cat > "$RUNNER_TEMP/packed.swift" <<'EOF'
          import Metal
          guard let d = MTLCreateSystemDefaultDevice() else { print("no device"); exit(3) }
          let desc = MTLTextureDescriptor.texture2DDescriptor(pixelFormat: .b5g6r5Unorm, width: 16, height: 16, mipmapped: false)
          print("b5g6r5 texture: \(d.makeTexture(descriptor: desc) != nil)")
          EOF
          swift "$RUNNER_TEMP/packed.swift" || echo "packed 16-bit create failed with exit $?"
