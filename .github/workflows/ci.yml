name: ci

on:
  push:
    branches: [main]
  pull_request:
  # So a branch can be run through the whole matrix before it has a PR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One bucket per ref, so a second push to a PR cancels the fan-out already
  # grinding on the commit it superseded. Not on main: every commit there gets a
  # complete, attributable result rather than a cancelled one.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Everything a run depends on that is not in the tree is pinned here, so a green
# main cannot turn red without a commit: both toolchains, and the two cargo tools
# a leg needs. All three are plain Makefile variables that float for a developer,
# and every cargo line in the Makefile names its toolchain with rustup's `+`
# syntax. The MSVC CRT and Windows SDK versions are pinned in the Makefile
# instead, beside the xwin call that consumes them.
env:
  WINE_RELEASE: cx-26.3.0-1
  RUST_STABLE: 1.97.1
  RUST_NIGHTLY: nightly-2026-08-18
  CARGO_TOOLS: xwin@0.10.0 cargo-nextest@0.9.143
  # The paravirtual GPU on a runner does not implement the counters the Metal HUD
  # samples, and says so on every launch. The validation layer keeps the
  # Makefile's default of on: it catches the misuse these legs exist to find.
  MTL_HUD_ENABLED: "0"

jobs:
  # The linear part: one job per runner architecture downloads and builds the
  # shared state (toolchains, the ~3 GB MSVC SDK splat, the Wine bundle, the
  # cargo registry) and saves it to the cache, so the legs below start warm
  # instead of a dozen runners racing to splat the same SDK. The caches are
  # keyed by runner architecture, so the arm64 images share one set and the
  # Intel image primes its own.
  setup:
    strategy:
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          pe: 'true'
          wine: 'true'
          wine-release: ${{ env.WINE_RELEASE }}
          prime: 'true'

  fmt-check:
    needs: setup
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - run: make fmt-check

  audit:
    needs: setup
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - run: make audit

  # clippy for the two PE targets. `pe` gates the MSVC SDK and the Wine SDK:
  # clippy runs build scripts, so snmalloc-sys and zstd-sys need the xwin headers
  # and the archiver, and windows/shim's build script reads Wine's libwinecrt0.a,
  # all before anything is linked.
  clippy-pe:
    needs: setup
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [i686, x86_64]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          pe: 'true'
          wine-release: ${{ env.WINE_RELEASE }}
      - run: make clippy-pe-${{ matrix.arch }}

  clippy-native:
    needs: setup
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - run: make clippy-native

  doc-windows:
    needs: setup
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          pe: 'true'
          wine-release: ${{ env.WINE_RELEASE }}
      - run: make doc-windows

  doc-unix:
    needs: setup
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - run: make doc-unix

  test-unit:
    needs: setup
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - run: make test-unit

  # The end-to-end suite: real PE binaries, run by the pinned Wine against a
  # Metal device, one leg per image, PE arch and variant. Needs everything,
  # `wine` included, since the leg installs our builtin into the SDK tree and
  # boots a prefix.
  #
  # Three images: the newest macOS on arm64, the oldest macOS mtld3d supports
  # on arm64, and the Intel image, whose paravirtual device has no unified
  # memory, no packed 16-bit formats and a 256-byte linear texture alignment,
  # so it runs the real Intel/AMD code paths with the strict Managed-memory
  # semantics the forced runs cannot check. The `intel` variant runs the same
  # suite with every `intel.*` config key on and only makes sense on an
  # Apple-family device, so it runs on the newest arm64 image alone. The two
  # older images are advisory until their first runs are read.
  test-e2e:
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.runner != 'macos-26' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-15-intel]
        arch: [i686, x86_64]
        variant: [native]
        include:
          - runner: macos-26
            arch: i686
            variant: intel
          - runner: macos-26
            arch: x86_64
            variant: intel
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          pe: 'true'
          wine: 'true'
          wine-release: ${{ env.WINE_RELEASE }}
      # The ci profile runs the suite serially and to completion; see
      # windows/.config/nextest.toml. Scoped to this job because the unix
      # workspace has no nextest config to carry the same profile.
      - run: make test-e2e-${{ matrix.arch }} INTEL=${{ matrix.variant == 'intel' && '1' || '' }}
        env:
          NEXTEST_PROFILE: ci

  # Wine's own d3d9_test.exe against our builtin, per-site counts diffed against
  # unix/conformance/baseline.txt. One arch per runner process, and not part of
  # `make test`: many subtests fail by design, so this gates on a regression
  # rather than on zero failures. The per-subtest budget is raised from its 180 s
  # default because the GPU here is paravirtual, and a subtest killed for taking
  # too long is reported as a crash.
  # This gates on the same baseline the local runs use, in both directions:
  # a count above its pin is a regression, a count below it is a stale
  # baseline (also fatal — see CONFORMANCE.md). The paravirtual GPU used to
  # diverge both ways, but every divergence traced to our own code (the
  # depth-clamp rule now lives in the FF vertex shader, display geometry and
  # the registry-mode restore come from the Win32 view, and the pipeline/pass
  # depth attachments can no longer disagree). The desktop-mode sites that
  # fail on a real Mac because macdrv rejects the tests' mode changes read
  # zero on this display; those carry the `ceiling` class, whose pin is a
  # cross-environment maximum.
  # The `intel` variant runs the suite under every `intel.*` config key and
  # gates on its own `<arch>+intel` baseline entries, on the newest arm64
  # image alone. The two older images run the native suite as advisory legs:
  # the baseline carries no per-image entries yet, so their counts are read
  # from the artifact until they are recorded and triaged.
  conformance:
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.runner != 'macos-26' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-15-intel]
        arch: [i686, x86_64]
        variant: [native]
        include:
          - runner: macos-26
            arch: i686
            variant: intel
          - runner: macos-26
            arch: x86_64
            variant: intel
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          pe: 'true'
          wine: 'true'
          wine-release: ${{ env.WINE_RELEASE }}
      - run: make conformance-${{ matrix.variant == 'intel' && 'intel-' || '' }}${{ matrix.arch }}
        env:
          MTLD3D_CONFORMANCE_TIMEOUT_SECS: "600"
          # Every subtest's full output, which is what carries the
          # `Got <actual>, expected <expected>` values behind each site. The
          # job's own log reduces to per-site counts, and counts alone cannot
          # say why this environment diverges.
          MTLD3D_CONFORMANCE_RAW_DIR: ${{ runner.temp }}/conformance-raw

      # `always()`, because a diverging run is exactly the one whose output is
      # worth reading, and the job reports failure whenever it diverges.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-raw-${{ matrix.runner }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/conformance-raw
          retention-days: 14
          if-no-files-found: error

  # The distribution bundle, which no other leg covers: it stages both install
  # routes, marks the builtins, and packs the symbols archive alongside, all from
  # artifacts for four targets. Built the way a release is, at the default PROD=1,
  # so the production profile's fat LTO is exercised here rather than first
  # failing when a release is cut. Costs about 5 minutes, which is less than the
  # e2e legs take.
  bundle:
    needs: setup
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # BUILD_ID, which names the build inside the symbols archive, comes
          # from `git describe --tags`.
          fetch-tags: true
      - uses: ./.github/actions/prepare
        with:
          pe: 'true'
          wine-release: ${{ env.WINE_RELEASE }}
      - run: make bundle

  # Manual only: what a hosted macOS runner exposes to Metal, on the Intel
  # image and the arm64 macOS 15 image. The OS, the device, and the capability
  # bits mtld3d branches on, then a clear pass and the one texture format the
  # Mac2 family lacks. Run it before adding a runner label to the matrices
  # above, since an image without a Metal device cannot run the e2e or
  # conformance legs at all.
  probe-metal:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Host
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.memsize
          xcodebuild -version || true
      - name: Displays and GPUs
        run: system_profiler SPDisplaysDataType || true
      - name: Metal device
        run: |
          cat > "$RUNNER_TEMP/probe.swift" <<'EOF'
          import Metal
          let all = MTLCopyAllDevices()
          print("MTLCopyAllDevices: \(all.count)")
          for d in all { print("  \(d.name)") }
          guard let d = MTLCreateSystemDefaultDevice() else {
              print("MTLCreateSystemDefaultDevice: nil")
              exit(3)
          }
          print("default device: \(d.name)")
          print("registryID: \(d.registryID)")
          print("hasUnifiedMemory: \(d.hasUnifiedMemory)")
          print("isLowPower: \(d.isLowPower) isHeadless: \(d.isHeadless) isRemovable: \(d.isRemovable)")
          print("supportsFamily apple2: \(d.supportsFamily(.apple2)) apple7: \(d.supportsFamily(.apple7)) mac2: \(d.supportsFamily(.mac2)) metal3: \(d.supportsFamily(.metal3))")
          print("supports32BitFloatFiltering: \(d.supports32BitFloatFiltering)")
          print("supports32BitMSAA: \(d.supports32BitMSAA)")
          print("minimumLinearTextureAlignment bgra8: \(d.minimumLinearTextureAlignment(for: .bgra8Unorm))")
          for n in [2, 4, 8] { print("supportsTextureSampleCount \(n): \(d.supportsTextureSampleCount(n))") }
          print("recommendedMaxWorkingSetSize: \(d.recommendedMaxWorkingSetSize)")
          print("maxBufferLength: \(d.maxBufferLength)")
          guard let queue = d.makeCommandQueue() else { print("makeCommandQueue: nil"); exit(4) }
          let desc = MTLTextureDescriptor.texture2DDescriptor(pixelFormat: .bgra8Unorm, width: 64, height: 64, mipmapped: false)
          desc.usage = [.shaderRead, .renderTarget]
          guard let tex = d.makeTexture(descriptor: desc) else { print("makeTexture bgra8: nil"); exit(5) }
          let managed = d.makeBuffer(length: 4096, options: [.storageModeManaged])
          print("managed buffer: \(managed != nil)")
          let sd = MTLSamplerDescriptor()
          sd.sAddressMode = .clampToBorderColor
          sd.tAddressMode = .clampToBorderColor
          sd.borderColor = .opaqueWhite
          print("border sampler: \(d.makeSamplerState(descriptor: sd) != nil)")
          let cb = queue.makeCommandBuffer()!
          let rp = MTLRenderPassDescriptor()
          rp.colorAttachments[0].texture = tex
          rp.colorAttachments[0].loadAction = .clear
          rp.colorAttachments[0].storeAction = .store
          rp.colorAttachments[0].clearColor = MTLClearColor(red: 1, green: 0, blue: 0, alpha: 1)
          let enc = cb.makeRenderCommandEncoder(descriptor: rp)!
          enc.endEncoding()
          cb.commit()
          cb.waitUntilCompleted()
          print("clear pass status: \(cb.status.rawValue) error: \(String(describing: cb.error))")
          var px = [UInt8](repeating: 0, count: 4)
          tex.getBytes(&px, bytesPerRow: 256, from: MTLRegionMake2D(0, 0, 1, 1), mipmapLevel: 0)
          print("pixel after clear (bgra): \(px)")
          EOF
          swift "$RUNNER_TEMP/probe.swift"
      - name: Packed 16-bit texture (Apple-family only; expected to abort on Mac2)
        run: |
          cat > "$RUNNER_TEMP/packed.swift" <<'EOF'
          import Metal
          guard let d = MTLCreateSystemDefaultDevice() else { print("no device"); exit(3) }
          let desc = MTLTextureDescriptor.texture2DDescriptor(pixelFormat: .b5g6r5Unorm, width: 16, height: 16, mipmapped: false)
          print("b5g6r5 texture: \(d.makeTexture(descriptor: desc) != nil)")
          EOF
          swift "$RUNNER_TEMP/packed.swift" || echo "packed 16-bit create failed with exit $?"
