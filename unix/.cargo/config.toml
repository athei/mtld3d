# No `[build] target` here: a bare `cargo build`/`test` in this workspace
# builds for the host, which is what unit tests and clippy want. The shipped
# `.so` is built with `--target aarch64-apple-darwin` (see the Makefile `unix:`
# recipe), the native arch, which needs no entry of its own: its ABI mandates
# a frame pointer anyway.
#
# Frame pointers are not pinned below: a normal build takes the toolchain
# default. The guest-pc sampling profiler needs them (it walks the frame-pointer
# chain), so a profiling build asks for them with `FP=1 make`, which appends
# `-C force-frame-pointers=yes` to the rustflags.

[env]
# The arm64 Wine that loads the `.so` runs on macOS 26 and later only.
MACOSX_DEPLOYMENT_TARGET = "26.0"
