# nextest configuration for the mtld3d workspaces.
#
# The end-to-end tests (package `mtld3d-tests`) each spawn a Wine process that
# creates a Metal device + window, so they are GPU/window-server-bound rather
# than CPU-bound. The `gpu` test-group caps how many run at once, and a
# slow-timeout kills any test that hangs (e.g. a wedged encoder thread) instead
# of stalling the whole run. The host-native unit tests (`mtld3d-core`,
# `mtld3d-shared`) are unaffected and run at full parallelism.

[test-groups]
gpu = { max-threads = 4 }

[[profile.default.overrides]]
filter = "package(mtld3d-tests)"
test-group = "gpu"
slow-timeout = { period = "30s", terminate-after = 2 }

# CI profile, for a runner where the GPU is paravirtual ('Apple Virtual') and
# every guest instruction is translated:
#
#   test-threads = 1    THE fix for that environment, not a precaution. Run four
#                       at a time there and tests that create a device abort or
#                       hang, the same test differing between arches and between
#                       runs; serially all 165 pass on both arches. A prefix
#                       under CrossOver needs the same treatment, for what is
#                       presumably the same reason: concurrent CreateDevice
#                       wedges something below us. Metal's validation layer was
#                       the other suspect and was cleared by re-enabling it
#                       alone on a serial run.
#   fail-fast = false   one broken test otherwise cancels the other 164, and a
#                       log showing four results out of 165 is what made the
#                       above take three runs to see.
#   slow-timeout        a test that is merely slow on a virtual GPU must not be
#                       killed and counted as a hang.
[profile.ci]
fail-fast = false
test-threads = 1

[[profile.ci.overrides]]
filter = "package(mtld3d-tests)"
test-group = "gpu"
slow-timeout = { period = "120s", terminate-after = 2 }
