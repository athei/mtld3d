# nextest configuration for the mtld3d workspaces.
#
# The end-to-end tests (package `mtld3d-tests`) each spawn a Wine process that
# creates a Metal device + window, so they are GPU/window-server-bound rather
# than CPU-bound. The `gpu` test-group caps how many run at once, and a
# slow-timeout kills any test that hangs (e.g. a wedged encoder thread) instead
# of stalling the whole run. The host-native unit tests (`mtld3d-core`,
# `mtld3d-shared`) are unaffected and run at full parallelism.

[test-groups]
gpu = { max-threads = 4 }
# A fullscreen device sets a display mode, and a mode is global to the
# wineserver session every e2e process attaches to, so two of these running at
# once would see each other's mode. They take turns; the override has to come
# before the package-wide one because nextest applies the first match.
modeset = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(mtld3d-tests) & (test(/fullscreen/) | test(/nowindowchanges/))"
test-group = "modeset"
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "package(mtld3d-tests)"
test-group = "gpu"
slow-timeout = { period = "30s", terminate-after = 2 }

# CI profile, for a runner whose GPU is paravirtual ('Apple Virtual') and whose
# guest code is translated:
#
#   test-threads = 1    Required there. Concurrent device creation aborts or
#                       hangs tests, non-deterministically; serially the suite
#                       passes. A prefix under CrossOver needs the same.
#   fail-fast = false   Report the whole suite rather than the first failure.
#   slow-timeout        A test that is only slow on a virtual GPU must not be
#                       killed and counted as a hang.
[profile.ci]
fail-fast = false
test-threads = 1

[[profile.ci.overrides]]
filter = "package(mtld3d-tests) & (test(/fullscreen/) | test(/nowindowchanges/))"
test-group = "modeset"
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = "package(mtld3d-tests)"
test-group = "gpu"
slow-timeout = { period = "120s", terminate-after = 2 }
