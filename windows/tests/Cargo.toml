[package]
name = "mtld3d-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
authors.workspace = true

# The harness library carries no unit tests of its own (the environment lock
# is pinned from `tests/e2e/device.rs`), so cargo builds no test binary for
# it: every binary under `tests/` is one Wine launch of the suite.
[lib]
test = false
doctest = false

[dependencies]
bitflags = { workspace = true }
mtld3d-types = { workspace = true }

# `tests/snmalloc_drift.rs` owns its snmalloc probe allocations explicitly;
# the allocator benchmark example installs snmalloc as its global allocator.
# The decommit-on-free probe needs the Windows PAL to return pages, so the
# check cannot live in `mtld3d-core`'s host tests. `mtld3d-core` comes along for
# `SNMALLOC_LOCAL_CACHE_BYTES` so the threshold is not written down twice.
[dev-dependencies]
zstd = { workspace = true }
xxhash-rust = { workspace = true }
mtld3d-core = { workspace = true }
# The benchmarks time with the layer's own `rdtsc` primitive and calibrated rate
# (`mtld3d_shared::tsc`) rather than a copy of either.
mtld3d-shared = { workspace = true }
snmalloc-rs = { workspace = true }

[lints]
workspace = true
