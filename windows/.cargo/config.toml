[build]
target = "i686-pc-windows-msvc"

# The PE baselines are `pentium4` (SSE2) for i686 and `x86-64-v2` (SSE4.2) for
# x86_64; `docs/BUILDING.md` ("Instruction-set baselines") gives what was
# measured for each.
#
# NO BMI here, in either PE target. These DLLs are guest code, so they run under whichever x86
# translator the host Wine uses, and CrossOver's arm64 Wine translates 32-bit
# guests with `xtajit`, which implements neither BMI2 nor BMI1. Each one aborted
# module init with STATUS_ILLEGAL_INSTRUCTION (c000001d) and took the game down
# at startup: first a `mulx` in the shim's DllMain, then an `andn` in d3d9's.
# Rosetta implements both, which is why this only ever showed up on an arm64
# Wine, and why the flags looked free for so long.
#
# LZCNT went with them: an ABM-less CPU decodes it as BSF/BSR rather than
# faulting, so an unsupported one would have gone unnoticed while quietly
# returning a different answer. `tzcnt` still appears in the disassembly, which
# is fine and not a regression of this rule: LLVM only emits it where BSF
# semantics agree, and the encoding is a REP-prefixed BSF that any x86 decodes.
#
# The unix `.so` keeps BMI for its x86_64 build (see `unix/.cargo/config.toml`):
# that one is host code and only ever runs under Rosetta, never under xtajit.
# Verified by running the whole i686 e2e suite against CrossOver's arm64 Wine.

# Frame pointers are not pinned here: a normal build takes the toolchain
# default. The guest-pc sampling profiler needs them (it recovers call stacks by
# walking the guest frame-pointer chain, and a build without them stops every
# walk at the leaf), so `FP=1 make` appends `-C force-frame-pointers=yes` to
# these rustflags for a build meant to be profiled.

# The PE linker is a symlink `make setup-rust` creates onto the `rust-lld` that
# the toolchain's own `llvm-tools` component ships, because LLD selects its COFF
# driver from the name it is invoked under. Same trick as the archiver at the
# bottom of this file, and between them nothing here needs a Homebrew LLVM.
[target.i686-pc-windows-msvc]
linker = "lld-link"
rustflags = [
    "-C", "target-cpu=pentium4",
    "-C", "target-feature=-crt-static",
    "-Lnative=/opt/xwin/crt/lib/x86",
    "-Lnative=/opt/xwin/sdk/lib/um/x86",
    "-Lnative=/opt/xwin/sdk/lib/ucrt/x86",
]

[target.x86_64-pc-windows-msvc]
linker = "lld-link"
rustflags = [
    "-C", "target-cpu=x86-64-v2",
    "-C", "target-feature=-crt-static",
    "-Lnative=/opt/xwin/crt/lib/x86_64",
    "-Lnative=/opt/xwin/sdk/lib/um/x86_64",
    "-Lnative=/opt/xwin/sdk/lib/ucrt/x86_64",
]

# The two halves of the ARM64X DLLs. Rust has no ARM64X target, so each crate
# is built once per half as a static library and the Makefile links both into
# one image with `lld-link /machine:arm64x` (see `windows-arm64x` there). Cargo
# never links a PE for these targets, so there is no linker and no library
# search path here: the Makefile names every import library itself.
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=-crt-static"]

[target.arm64ec-pc-windows-msvc]
rustflags = ["-C", "target-feature=-crt-static"]

[env]
# xwin include paths repeated for C and C++ — cc-rs reads CFLAGS_<target>
# and CXXFLAGS_<target> separately with no cross-fallback, and TOML has
# no variable substitution. snmalloc-sys needs the C++ path for <atomic>;
# libmimalloc-sys only needs the C one.
#
# `-march` mirrors the rustflags `target-cpu` baseline so build-script C/C++
# code (snmalloc-sys is the big one — ~300 KB of object in release on x86_64)
# gets the same ISA: `x86-64-v2` on 64-bit, `pentium4` on 32-bit (which has no
# x86-64-vN level). These DLLs run under x86-on-ARM translation, whose vector
# unit is 128-bit: 256-bit AVX/AVX2 ops are split across two halves and
# underperform plain SSE, so neither baseline goes past SSE4.2, with no BMI for
# the reason given above the rustflags. Where each one sits below that ceiling
# was measured; `docs/BUILDING.md` has the numbers.
# cc-rs invokes clang for these targets (the `-idirafter` flags here are
# clang-style), so these flags propagate without needing an MSVC `/arch:`
# spelling.
#
# cc-rs builds each command line from `CFLAGS`, then `TARGET_CFLAGS` or
# `HOST_CFLAGS`, then these `CFLAGS_<target>` values, all concatenated in that
# order, and appends them after the flags and defines a build script adds
# itself. That is how a production build adds `NDEBUG` through the plain
# `CFLAGS` (see the Makefile) without restating anything here.
#
# `-fno-omit-frame-pointer` stays unconditional here rather than following the
# Rust side's `FP=1` knob: this is a fixed, small amount of code (snmalloc-sys
# and zstd-sys) whose frames are worth keeping walkable in every build. Because
# these flags come last, it also overrides the `-fomit-frame-pointer` that
# snmalloc-sys's build script adds.
CFLAGS_i686-pc-windows-msvc     = "-march=pentium4 -fno-omit-frame-pointer -idirafter /opt/xwin/crt/include -idirafter /opt/xwin/sdk/include/ucrt -idirafter /opt/xwin/sdk/include/um -idirafter /opt/xwin/sdk/include/shared"
CFLAGS_x86_64-pc-windows-msvc   = "-march=x86-64-v2 -fno-omit-frame-pointer -idirafter /opt/xwin/crt/include -idirafter /opt/xwin/sdk/include/ucrt -idirafter /opt/xwin/sdk/include/um -idirafter /opt/xwin/sdk/include/shared"
CXXFLAGS_i686-pc-windows-msvc   = "-march=pentium4 -fno-omit-frame-pointer -idirafter /opt/xwin/crt/include -idirafter /opt/xwin/sdk/include/ucrt -idirafter /opt/xwin/sdk/include/um -idirafter /opt/xwin/sdk/include/shared"
CXXFLAGS_x86_64-pc-windows-msvc = "-march=x86-64-v2 -fno-omit-frame-pointer -idirafter /opt/xwin/crt/include -idirafter /opt/xwin/sdk/include/ucrt -idirafter /opt/xwin/sdk/include/um -idirafter /opt/xwin/sdk/include/shared"
# The ARM64X halves link llvm-mingw's CRT, not MSVC's (see `windows-arm64x` in
# the Makefile), so the C++ of snmalloc-sys is built the way snmalloc builds it
# for every non-MSVC target: without exceptions and RTTI, whose runtime
# support lives in MSVC's static CRT. `-fno-threadsafe-statics` drops the
# guard calls MSVC's static CRT would also have to supply; snmalloc's one guarded
# local static is initialised under its own `Singleton` lock, and the Makefile
# fails the leg if another one appears. `SNMALLOC_USE_THREAD_CLEANUP` takes the
# allocator's per-thread teardown off C++ `thread_local` destructors, which
# llvm-mingw registers through a `__tlregdtor` that never runs them: snmalloc
# then exports `_malloc_thread_cleanup` for the platform to call at thread
# exit, and `windows/d3d9/src/arm64_crt.rs` calls it from a TLS callback.
# `ARM64_SYSREG` is the Windows SDK macro snmalloc's ARM layer reads its cycle
# counter with; the SDK defines it in `arm64intr.h`, which clang's own header
# of that name shadows. ARM64EC defines `_M_X64`, so zstd would include the
# x86 SIMD headers, which clang cannot compile for an ARM64 back end:
# `ZSTD_NO_INTRINSICS` keeps it on its scalar code.
CFLAGS_aarch64-pc-windows-msvc    = "-idirafter /opt/xwin/crt/include -idirafter /opt/xwin/sdk/include/ucrt -idirafter /opt/xwin/sdk/include/um -idirafter /opt/xwin/sdk/include/shared"
CFLAGS_arm64ec-pc-windows-msvc    = "-DZSTD_NO_INTRINSICS -idirafter /opt/xwin/crt/include -idirafter /opt/xwin/sdk/include/ucrt -idirafter /opt/xwin/sdk/include/um -idirafter /opt/xwin/sdk/include/shared"
CXXFLAGS_aarch64-pc-windows-msvc  = "-fno-exceptions -fno-rtti -fno-threadsafe-statics -DSNMALLOC_USE_THREAD_CLEANUP -DARM64_SYSREG(op0,op1,crn,crm,op2)=((((op0)&1)<<14)|(((op1)&7)<<11)|(((crn)&15)<<7)|(((crm)&15)<<3)|((op2)&7)) -idirafter /opt/xwin/crt/include -idirafter /opt/xwin/sdk/include/ucrt -idirafter /opt/xwin/sdk/include/um -idirafter /opt/xwin/sdk/include/shared"
CXXFLAGS_arm64ec-pc-windows-msvc  = "-fno-exceptions -fno-rtti -fno-threadsafe-statics -DSNMALLOC_USE_THREAD_CLEANUP -DARM64_SYSREG(op0,op1,crn,crm,op2)=((((op0)&1)<<14)|(((op1)&7)<<11)|(((crn)&15)<<7)|(((crm)&15)<<3)|((op2)&7)) -idirafter /opt/xwin/crt/include -idirafter /opt/xwin/sdk/include/ucrt -idirafter /opt/xwin/sdk/include/um -idirafter /opt/xwin/sdk/include/shared"
# The MSVC librarian, as a bare name resolved from PATH: `make setup-rust` puts an
# `llvm-lib` symlink in the cargo bin directory onto `llvm-ar`, which switches to
# lib.exe-compatible mode based on the name it is invoked under. That mode is what
# matters, because cc-rs drives the archiver with MSVC syntax (`-out:`) for these
# targets. Apple's `ar` cannot stand in: it is Mach-O only, and handed a COFF
# object it writes an archive with no members at all and exits 0.
AR_i686-pc-windows-msvc         = "llvm-lib"
AR_x86_64-pc-windows-msvc       = "llvm-lib"
AR_aarch64-pc-windows-msvc      = "llvm-lib"
AR_arm64ec-pc-windows-msvc      = "llvm-lib"
# `llvm-lib` infers an archive's machine from its first member and takes an
# ARM64EC object for a plain ARM64 one, so it is told which it is writing.
ARFLAGS_arm64ec-pc-windows-msvc = "-machine:arm64ec"
