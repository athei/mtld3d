# mtld3d configuration file
#
# Drop this file next to the game's .exe (the directory `std::env::current_exe()`
# resolves to inside Wine — same place as the EXE itself). mtld3d reads it
# at each `Direct3DCreate9`; the interface that call returns and every device
# it creates keep what was read. A game creates one interface at start-up,
# so a later edit requires restarting the game.
#
# Lines starting with `#` are comments. Each option below is spelled out with
# its default value and left commented out, so the file is a no-op until you
# uncomment a line.
#
# Format:  key = value
#   Booleans: `true` / `false` (case-insensitive)
#   Strings:  bare or `"quoted"` (quote when the value has trailing whitespace)
#   Lists:    comma-separated, see `debug.skipShaders` for hex parsing
#
# Unknown keys, malformed lines, and unparseable values fire a one-shot
# `log_once_warn!` and otherwise no-op (parsing continues; the default
# value is preserved). Use `RUST_LOG=mtld3d::d3d9=info` to see the
# resolved option set on startup.
#
# Every key below is also overridable at launch via the `MTLD3D_CONFIG`
# env var: a semicolon-separated list of `key=value` entries using the
# same syntax as this file. Env entries are merged on top of the file
# (env wins on conflict); unset keys keep their file (or default) value.
# Example:
#   MTLD3D_CONFIG="color.hdr.enable=false;cursor.scale=2"
#
# A few games need options no user should have to discover, so mtld3d
# ships built-in profiles for them: an application matched by the version
# resource its vendor linked into the executable gets that profile's keys
# as its starting point. A profile is the weakest layer, below this file
# and below `MTLD3D_CONFIG`, so any single key it sets can be taken back
# without losing the rest. `RUST_LOG=mtld3d::d3d9=info` prints which
# profile matched, followed by every resolved option. The README lists
# the profiles that ship; `windows/core/src/app_profile.rs` carries the
# reason for every key each one sets.


###########
# Logging #
###########

# Directory the process's log file and GPU traces go into.
#
# Every line of both halves of mtld3d goes to a file, never to the process's
# standard streams: a game a launcher spawned has no usable ones, and a
# launcher's own log dies with its pipe. Each process writes
# `<exe>-<pid>.log` here, so a launch never overwrites the log of the one
# before it, and the GPU traces F12 captures land next to it as
# `<exe>-<pid>-<n>.gputrace`. The file appears with the first line written,
# so a process that logs nothing (`RUST_LOG=off`) leaves nothing behind. A
# directory that cannot be created falls back to stderr with one line
# saying so. The directory keeps the ten newest logs and the ten newest
# traces; creating one past that removes the oldest of its kind.
#
# The log file is one per process: the first `Direct3DCreate9` names its
# location and a later interface leaves it where it is.
#
# Default: "" (`mtld3d-logs` next to the executable)
# Supported values: a directory path, relative to the executable's
# directory or absolute; empty means the default

# log.dir = ""

##########
# Color  #
##########

# Layer colorspace tagging policy.
#
# `passthrough` (the default) tags the `CAMetalLayer` with the
# display's own `CGColorSpace`. macOS does an identity round-trip,
# so D3D9's untagged RGB values land at the panel's native primaries
# — maximum vibrance per display, but on a wide-gamut panel the same
# colours render with more saturation than the game's designer
# intended.
#
# `accurate` overrides that with the sRGB family
# (`kCGColorSpaceSRGB` for SDR, `kCGColorSpaceExtendedLinearSRGB`
# for HDR). D3D9 art was overwhelmingly authored against sRGB
# primaries, so tagging the layer as sRGB asks the compositor for
# colour-managed conversion to the panel — designer-intended hues
# instead of a gamut stretch.
#
# Default: passthrough
# Supported values: passthrough, accurate

# color.space = passthrough

# Enable the HDR present pipeline on EDR-capable displays.
#
# On by default. When the attached `NSScreen` reports EDR headroom,
# mtld3d upgrades the `CAMetalLayer` to `extendedDynamicRange` and
# routes present through the BT.2446-A inverse-tone-mapping shader
# (encoded in ICtCp), with the shader's peak following the display's
# live headroom. The layer's colorspace tag follows `color.space` above
# (extended-linear variant on the HDR side either way: float surfaces
# require a linear tag). Set `false` to force the SDR blit regardless
# of display capability. Users on non-HDR displays see no difference
# either way: the display's headroom is what decides, so a screen
# without EDR runs the same SDR path with the key at either value.
#
# Default: true
# Supported values: true, false

# color.hdr.enable = true


###########
# Cursor  #
###########

# Cursor bitmap enlargement factor, for the hardware cursor and the
# software cursor alike.
#
# In Wine's retina mode the game draws at physical pixels, and its cursor
# bitmap comes out at half a point per pixel: half the size it has on a
# 1x display. `auto` (the default) doubles the bitmap when the prefix runs
# in retina mode and leaves it alone otherwise, since without retina mode
# macOS already doubles everything the game draws, the cursor included.
# Set a positive integer to override (e.g. `2` for a uniform 2x cursor).
# Values above 8 clamp to 8 at use time.
#
# Default: auto
# Supported values: auto, 1, 2, 3, …

# cursor.scale = auto

# Draw the cursor in a transparent overlay window instead of the hardware cursor.
#
# The game's cursor bitmap is rendered by mtld3d into a borderless,
# click-through window that follows the pointer, and the Win32 cursor
# is kept blank while the pointer is over the game. Two things this
# buys: on stock Wine, showing or hiding the hardware cursor toggles
# the WindowServer cursor plane and every toggle delays the next
# present by one refresh, so a game that hides the cursor while a mouse
# button is held stutters under rapid clicking; and macOS has no HDR
# cursor, so the hardware cursor stays at SDR brightness over HDR
# content while the overlay is tone-mapped like the frame. The cost: a
# window on top of the game window sends the game window through the
# compositor instead of direct-to-display. Under HDR the EDR layer is
# composited anyway, so `auto` (the default) turns the software cursor
# on exactly when the HDR present path is active and leaves the SDR
# path alone. `true` forces it on (a composited SDR window), `false`
# forces the hardware cursor. Resolved once when the device is created
# and held for its lifetime. Cursors a game sets through user32
# directly, bypassing D3D9, stay hardware cursors either way.
#
# Default: auto
# Supported values: auto, true, false

# cursor.software = auto

##################
# Shader cache  #
##################

# Use the persistent on-disk shader cache (`mtld3d_shaders.bin` next to
# the game's .exe).
#
# When `true` (the default), mtld3d warms its in-memory shader cache from
# disk at startup and appends a record per cache-miss compile so the
# next run avoids re-compiling. Disable with `false` if you're
# bisecting a shader-emitter change and want to force every shader to
# re-compile from bytecode on each run (the cache key is content-hashed
# bytecode, so a stale entry written by a buggy emitter would otherwise
# pin you to the bug across runs).
#
# Default: true
# Supported values: true, false

# shaderCache.enable = true


###########
# Query   #
###########

# Answer `GetData(D3DGETDATA_FLUSH)` on a pending occlusion query at
# once, with the permissive "fully visible" count, instead of waiting
# for the GPU to finish the frame that holds the query.
#
# The wait is what D3D9 specifies, and an engine that polls with FLUSH
# normally reads the number it gets back: Grand Theft Auto IV culls
# its coronas by it, Source computes the visible fraction of its sun
# and lens flares from it. The immediate answer is for a title that
# uses the poll loop only as a GPU fence and never reads the count,
# where the wait costs API-thread time for nothing: both World of
# Warcraft clients fence every loading-screen upload batch that way,
# and their built-in profile sets this to true.
#
# Default: false
# Supported values: true, false

# query.flushImmediate = false


#########
# Depth #
#########

# A newly bound same-size depth-stencil texture inherits the previous
# one's contents.
#
# D3D9-era drivers commonly backed all equal-size depth-stencil
# surfaces with one physical allocation. Engines of that era exploit
# this: render scene depth with one depth texture bound, then bind a
# *different* depth texture of the same size and z-test against it
# while sampling the first (sampling the bound depth-stencil itself is
# forbidden in D3D9). No copy appears anywhere in the API stream; the
# content flows through the shared driver allocation. When enabled,
# binding a texture-backed depth-stencil whose dimensions match the
# previously bound one queues a GPU copy of the previous contents into
# it, reproducing that behavior explicitly.
#
# Leave off for engines that clear every depth target before use (the
# common case): they would pay one full-surface GPU copy per
# depth-target switch for nothing.
#
# Default: false
# Supported values: true, false

# depth.aliasSameSize = false


###########
# Buffers #
###########

# Disbelieve the byte range a Lock on a static vertex/index buffer
# announces, and upload the whole buffer instead.
#
# Every vertex or index buffer except a DEFAULT + DYNAMIC one keeps its
# CPU staging separate from the device buffer the GPU reads, and only the
# [OffsetToLock, SizeToLock) window recorded at Lock is uploaded when the
# buffer is unlocked. A few D3D9-era titles write past the window they
# named. On a real driver that landed anyway, because the pointer handed
# back pointed into the single allocation the GPU read, so nothing
# noticed; here the bytes outside the window never cross and the GPU
# reads whatever the device allocation held.
#
# Left off, which is the default, the announcement is taken at its word.
# That is the dirty range D3D9 describes, the titles that overrun it are
# rare, and widening is far more expensive here than the extra copy it
# looks like: a whole-buffer range always overlaps a range some draw
# already read this frame, so it is not a wider memcpy but a rename,
# meaning a fresh Private device buffer, a full device-to-device preserve
# copy, and the old buffer retained against memory.vbibRetentionCapMB,
# where reaching the cap forces a synchronous mid-frame GPU wait.
#
# Turn it on for a title whose geometry is stretched, folded onto a stale
# pose or missing where it re-locks a static buffer without re-announcing
# all of it. The failure mode is silent: no error, no log line, just
# wrong pixels. With it on, no pool's announcement binds: a MANAGED
# buffer uploads whole as readily as a DEFAULT one, since no pool's
# contract says how far a write through the returned pointer may reach.
# Watch the `staging up` and `reorder` rows of the resources grid in a
# PERF=1 run.
#
# Two lock shapes never bind their announcement in either position,
# because neither names a narrower window to begin with: D3DLOCK_DISCARD,
# which abandons the whole buffer's contents by definition and on a
# non-DYNAMIC buffer is used outside what it is defined for, and a zero
# SizeToLock, which D3D9 documents as locking the entire buffer. Both
# then upload from offset zero, so the undocumented (offset > 0, size 0)
# form covers the head of the buffer rather than leaving it as the
# previous upload left it.
#
# No title is currently known to need this here. The class is real but
# small, and its three named members have not been run against mtld3d:
# Halo PC (Custom Edition and Trial), which creates an 8-byte index
# buffer, locks the first 4 bytes and writes all 8; Splinter Cell: Chaos
# Theory, whose night-vision goggles render white without it; and the
# Ümlaüt Design demos (UDS3.exe), which lose part of a shattering sphere.
# Against them, Kane & Lynch: Dead Men and the King's Bounty games lose
# an order of magnitude of frame time to the wide rule, because they
# re-lock a 37 MB static DEFAULT buffer several times a frame. Need for
# Speed Carbon was measured here announcing honestly across 2001 staged
# unlocks.
#
# Default: false
# Supported values: true, false

# buffer.ignoreLockBounds = false


###########
# Memory  #
###########

# Cap on live VB/IB retained-PageBox memory (MiB).
#
# A Lock of an in-flight vertex/index buffer that cannot write in place
# gets a fresh backing, and the old one is retained until the GPU stops
# reading it. Two cases reach that queue: a DYNAMIC buffer locked with
# DISCARD or over its whole length, and the snapshot a non-DYNAMIC
# buffer's Unlock hands the encoder for its dirty-range upload. During
# a camera turn the game repacks hundreds of buffers per frame; if the
# GPU falls behind, the queue can balloon (observed ~1.4 GB) and thrash
# the 32-bit game process. This caps live retained bytes: at the limit
# the alloc path drains retired backings and, if still over, forces a
# mid-frame GPU-sync before allocating, trading a bounded, predictable
# stall for the unbounded memory growth + OOM risk.
#
# Lower it if you still see memory-pressure stalls; raise it if turns
# stall on the GPU-sync more than the memory pressure warrants. `0`
# disables the cap, leaving retention unbounded — nothing else limits
# it, so an exhausted address space aborts the process.
#
# Default: 512
# Supported values: non-negative integer (MiB; 0 = disabled)

# memory.vbibRetentionCapMB = 512

# Ceiling on the video memory GetAvailableTextureMem advertises (MiB).
#
# An engine of this era sizes its texture and streaming pools from what
# that call reports, then commits against the figure. A 32-bit guest runs
# out of process address space long before a unified-memory Mac runs out
# of GPU memory, and what fails at that point is a Metal command buffer,
# out of memory, whose rendering is discarded: geometry and textures go
# missing rather than an allocation returning an error the title could
# handle.
#
# 0 lifts the ceiling. The default caps a 32-bit guest and leaves a
# 64-bit one alone.
#
# Default: 1024 on a 32-bit guest, 0 on 64-bit
# Supported values: non-negative integer (MiB; 0 = no ceiling)

# memory.vramBudgetMB = 1024

# PageBox recycle pool cap (MiB).
#
# Every contended Lock of a DYNAMIC vertex/index buffer allocates a
# fresh 16 KiB-aligned backing and frees the old one a frame later.
# Cycling those through the general allocator lets it return the pages
# to the OS, so the game's first write into each fresh backing pays a
# page fault plus mapping syscalls (expensive under Wine + Rosetta).
# With a non-zero cap, retired backings are instead parked in a
# per-size pool, up to this many MiB, and handed back warm to the next
# same-size Lock. Measured effect of enabling it: ~900 MB/s of backing
# churn stops hitting the allocator and the process fault rate drops
# ~50x. Parked memory stays committed, bounded by this cap; the
# default leaves ~2x headroom over the observed quiet-scene peak
# (53 MiB). `0` disables the pool. The pool is one per process, so the
# value the most recent `Direct3DCreate9` resolved is the one in force.
#
# Default: 128
# Supported values: non-negative integer (MiB; 0 = disabled)

# memory.pageboxPoolCapMB = 128


################
# Presentation #
################

# Frame-rate ceiling (Hz).
#
# Caps how often mtld3d presents, independent of the game's vsync
# request. Useful to trade frame rate for battery/thermals, or to
# bound a free-running (vsync-off) game without re-enabling vsync.
# When both this cap and vsync are active, the lower rate wins:
# `present.maxFps = 60` on a 120 Hz panel gives 60 fps with vsync on.
# Values above the panel's refresh rate have no extra effect while
# vsync is on (the panel ceiling still applies). `0` disables the cap.
#
# Default: 0 (uncapped)
# Supported values: non-negative integer (Hz; 0 = uncapped)

# present.maxFps = 0


##############
# Rendering  #
##############

# Render resolution as a fraction of the presented size, MetalFX-upscaled.
#
# `1.0` (the default) renders at full resolution and changes nothing.
# Below that, the scene is rasterized on a smaller grid and MetalFX
# upscales it on the way to the screen: `0.5` renders a quarter of the
# pixels. That trades image detail for frame rate, which is worth it when
# the GPU is the limit. `0.75` is a good first try; `0.5` is noticeably
# soft, because the interface and text are scaled along with the world.
#
# MetalFX is an edge-aware spatial upscaler, so the result is sharper
# than the plain stretch the display would otherwise do.
#
# In fullscreen the display mode picked in the game's own video options is
# set (virtually, under Wine's EmulateModeset) and sizes the back buffer, and
# this scale multiplies on top: a 1600x900 game setting at `0.75` rasterizes
# 1200x675, upscaled to the screen in one MetalFX pass. In a maximized
# window, and for a fullscreen request that is no real display mode, the
# back buffer follows the window instead, so there this scale is the only
# resolution control.
#
# A render target or depth buffer the game creates at exactly the size it
# was given for the back buffer is treated as part of the same image and
# scales with it, so a game that draws its world into a target of its own
# and blits the result still rasterizes fewer pixels. Targets at other
# sizes (shadow maps, post-process chains) keep the resolution the game
# chose; if the scene lands in one of those, a one-shot warning says so.
#
# A render target created lockable is the exception at any size: the game
# reads and writes its pixels through a CPU buffer laid out at the size it
# asked for, so the target stays that size and the two halves keep
# addressing one image.
#
# Values above `1.0` are not accepted. Rendering more pixels than are
# displayed needs a downscale on present, and the one present has is a
# single bilinear tap, which drops samples instead of averaging them: it
# would cost the GPU time without buying the detail supersampling is for.
#
# Ignored on a GPU without MetalFX support (a one-shot warning says so);
# the render resolution is held at `1.0` there rather than falling back
# to a blurrier scaler than the one you would have had.
#
# Default: 1.0
# Supported values: a number in (0, 1.0]

# render.scale = 1.0

# Keep texture detail at the presented size under a reduced render.scale.
#
# A texture's mip level follows the size it is drawn at, and under
# `render.scale` that is the smaller render grid: at `0.5` every texture
# is sampled one level coarser than the presented size warrants, so
# MetalFX upscales an image that is softer than it needs to be. With this
# on, every draw into a scaled target samples with a bias of `log2(scale)`
# on top of any bias the game sets, which brings the texture detail back
# to the presented resolution; the FSR and DLSS integration guides
# prescribe the same bias. The cost is a little more texture bandwidth
# and, on high-frequency textures, some shimmer a spatial upscaler cannot
# average away, which is why it is a knob. Does nothing at `1.0`, and so
# nothing on a GPU without MetalFX.
#
# Default: true
# Supported values: true, false

# render.lodBias = true


#######################
# Intel compatibility #
#######################

# Every key in this section forces one answer an Intel or AMD Mac (Metal's
# Mac2 GPU family) gives for a device capability, so the code path that
# answer selects runs on an Apple Silicon machine as well. They exist for the
# test suites (`make test INTEL=1`, `make conformance-intel`) and for
# reproducing an Intel report without the hardware. Each key is combined
# with the device's own answer so it can only ever move towards the Intel
# behaviour, never claim a capability the device lacks. Play with all of
# them off.

# Force the packed 16-bit expansion path used on non-Apple-family GPUs.
#
# Intel/AMD Macs lack the packed 16-bit pixel formats, so A4R4G4B4 /
# R5G6B5 / A1R5G5B5 / X1R5G5B5 textures are backed by BGRA8 there, with
# texels widened by a GPU upload pass, and the 16-bit render-target
# formats are not advertised.
#
# Default: false
# Supported values: true, false

# intel.expandPacked16 = false

# Deny linear filtering of single-precision float textures.
#
# R32F / G32R32F / A32B32G32R32F sample with linear filtering only on
# GPUs that report Metal's 32-bit float filtering support: Apple-family
# GPUs do, and Intel/AMD Macs commonly do not, so on those
# CheckDeviceFormat answers the D3DUSAGE_QUERY_FILTER probe with
# NOTAVAILABLE and an engine picks another scene format. Setting this
# key true forces that negative answer on any device. Sampling itself is
# untouched either way: only the probe's answer moves.
#
# Default: false
# Supported values: true, false

# intel.denyFloat32Filtering = false

# Treat the GPU as having no unified memory.
#
# On an Intel/AMD Mac the CPU and the GPU do not share memory, so every
# CPU-visible buffer (vertex, index, staging, query) is created in Metal's
# Managed storage mode and each CPU write is followed by a didModifyRange
# call that copies the dirty range to VRAM. Setting this key true selects
# that storage policy on any device. On unified memory the GPU sees CPU
# writes with or without the notify, so this exercises the path but cannot
# catch a notify that was left out; only Intel hardware can.
#
# Default: false
# Supported values: true, false

# intel.managedMemory = false

# Use the 256-byte linear texture row alignment of an Intel/AMD Mac.
#
# Metal's minimum row alignment for a texture upload is 16 bytes on
# Apple-family GPUs and 256 on Mac2. A mip level whose row pitch is below
# that floor cannot be blitted from its tightly packed staging, so it is
# repacked into padded rows or written by the GPU upload pass instead.
# Setting this key true raises the floor to 256 on any device (a larger
# device value is kept), which puts every level narrower than 64 texels
# of a 32-bit format onto those paths.
#
# Default: false
# Supported values: true, false

# intel.linearAlign256 = false


#####################
# Debug diagnostics #
#####################

# Expand capability bits to the spec maximum.
#
# OR-in every `D3DCAPS9_*_ALL` mask so the game requests every feature
# it knows about, surfacing unimplemented paths via `log_once_warn!`
# under `RUST_LOG=mtld3d=warn`. Visual rendering may degrade because
# unimplemented features fall back to stubs — this is for log-side
# discovery, not pixels. Pair with `RUST_LOG=mtld3d::d3d9::state=trace`
# to enumerate every RS/TSS/SAMP write the game makes.
#
# Default: false
# Supported values: true, false

# debug.capsAll = false

# Directory to dump raw DXSO bytecode into.
#
# When non-empty, the first time each shader is compiled mtld3d writes
# `<dir>/{vs,ps}_<hash>.dxso` containing the raw little-endian `u32`
# token stream. The directory is created on first use. Subsequent
# sights of the same shader id are no-ops. Use with the offline
# disassembler in the source tree (`cd windows && cargo run --example
# disasm --target aarch64-apple-darwin -- <dir>/ps_<hash>.dxso`) to
# inspect the bytecode + emitted MSL without re-running the game. The hash
# matches the value the per-pass debug log prints as `VS prog 0xN` /
# `PS prog 0xN`.
#
# Default: "" (disabled)
# Supported values: any directory path; empty disables

# debug.bytecodeDumpDir = ""

# Shader-identity bisection probe — drop draws whose VS or PS matches.
#
# Comma-separated list of `pair_id().hash` u64s in hex (with or
# without the `0x` prefix). Any draw whose VS hash *or* PS hash
# appears in the list is dropped on the encoder thread before
# Metal encoding. Stable across frames (unlike index-based skip),
# so this is the right tool when draw counts vary frame-to-frame.
# Get the hashes from the per-pass debug log lines
# (`RUST_LOG=mtld3d::d3d9=debug`).
#
# Default: "" (no draws skipped)
# Supported values: comma-separated hex u64s, e.g. "0xabc, 0xdef"

# debug.skipShaders = ""

# Report the adapter as a well-known GPU vendor.
#
# D3D9-era engines choose vendor-specific render paths (depth copies
# via StretchRect on one vendor, a resolve hack on another) and turn
# those paths off entirely for a vendor they do not recognize, which
# leaves depth-dependent effects (light glows, lens flares) reading a
# buffer nothing updates. The spoof presents a consistent identity in
# GetAdapterIdentifier: vendor id, device id, marketing description,
# driver DLL name and driver version.
#
# Default: none (report the real identity)
# Supported values: none | nvidia | amd

# adapter.spoof = none

# Advertise the DF24 / DF16 sampleable-depth formats.
#
# These fourccs existed on one vendor's hardware. An engine that
# probes them next to INTZ and finds both available can take a mixed
# depth path no real GPU ever ran; setting this to false hides the DF
# formats from CheckDeviceFormat (INTZ stays advertised).
#
# Default: true
# Supported values: true | false

# caps.dfFormats = true
