# mtld3d configuration file
#
# Drop this file next to the game's .exe (the directory `std::env::current_exe()`
# resolves to inside Wine — same place as the EXE itself). mtld3d reads it
# once at `Direct3DCreate9` time; any later edits require restarting the game.
#
# Lines starting with `#` are comments. Each option below is spelled out with
# its default value and left commented out, so the file is a no-op until you
# uncomment a line.
#
# Format:  key = value
#   Booleans: `true` / `false` (case-insensitive)
#   Strings:  bare or `"quoted"` (quote when the value has trailing whitespace)
#   Lists:    comma-separated, see `debug.skipShaders` for hex parsing
#
# Unknown keys, malformed lines, and unparseable values fire a one-shot
# `log_once_warn!` and otherwise no-op (parsing continues; the default
# value is preserved). Use `RUST_LOG=mtld3d::d3d9=info` to see the
# resolved option set on startup.
#
# Every key below is also overridable at launch via the `MTLD3D_CONFIG`
# env var: a semicolon-separated list of `key=value` entries using the
# same syntax as this file. Env entries are merged on top of the file
# (env wins on conflict); unset keys keep their file (or default) value.
# Example:
#   MTLD3D_CONFIG="color.hdr.enable=false;cursor.scale=2"
#
# A few games need options no user should have to discover, so mtld3d
# ships built-in profiles for them: an application matched by the version
# resource its vendor linked into the executable gets that profile's keys
# as its starting point. A profile is the weakest layer, below this file
# and below `MTLD3D_CONFIG`, so any single key it sets can be taken back
# without losing the rest. `RUST_LOG=mtld3d::d3d9=info` prints which
# profile matched, followed by every resolved option. See the README for
# the profiles that ship and what each one is for.


##########
# Color  #
##########

# Layer colorspace tagging policy.
#
# `passthrough` (the default) tags the `CAMetalLayer` with the
# display's own `CGColorSpace`. macOS does an identity round-trip,
# so D3D9's untagged RGB values land at the panel's native primaries
# — maximum vibrance per display, but on a wide-gamut panel the same
# colours render with more saturation than the game's designer
# intended.
#
# `accurate` overrides that with the sRGB family
# (`kCGColorSpaceSRGB` for SDR, `kCGColorSpaceExtendedLinearSRGB`
# for HDR). D3D9 art was overwhelmingly authored against sRGB
# primaries, so tagging the layer as sRGB asks the compositor for
# colour-managed conversion to the panel — designer-intended hues
# instead of a gamut stretch.
#
# Default: passthrough
# Supported values: passthrough, accurate

# color.space = passthrough

# Enable the HDR present pipeline on EDR-capable displays.
#
# On by default. When the attached `NSScreen` reports EDR headroom,
# mtld3d upgrades the `CAMetalLayer` to `extendedDynamicRange` and
# routes present through the BT.2446-A inverse-tone-mapping shader
# (encoded in ICtCp), with the shader's peak following the display's
# live headroom. The layer's colorspace tag follows `color.space` above
# (extended-linear variant on the HDR side either way: float surfaces
# require a linear tag). Set `false` to force the SDR blit regardless
# of display capability. Users on non-HDR displays see no difference
# either way: the display's headroom is what decides, so a screen
# without EDR runs the same SDR path with the key at either value.
#
# Default: true
# Supported values: true, false

# color.hdr.enable = true


###########
# Cursor  #
###########

# Hardware-cursor (`HCURSOR`) bitmap enlargement factor.
#
# Wine's HCURSOR path doesn't participate in macOS's automatic retina
# upscale, so on a 2× display the default cursor sprite is half-sized.
# `auto` (the default) reads `NSWindow.backingScaleFactor`, rounds, and
# clamps to `[1, 8]` — the cursor matches the panel. Set a positive
# integer to override (e.g. `2` for a uniform 2× cursor, useful when
# `backingScaleFactor` reports 1 on a hi-DPI external panel). Values
# above 8 clamp to 8 at use time.
#
# Default: auto
# Supported values: auto, 1, 2, 3, …

# cursor.scale = auto

##################
# Shader cache  #
##################

# Use the persistent on-disk shader cache (`mtld3d_shaders.bin` next to
# the game's .exe).
#
# When `true` (the default), mtld3d warms its in-memory shader cache from
# disk at startup and appends a record per cache-miss compile so the
# next run avoids re-compiling. Disable with `false` if you're
# bisecting a shader-emitter change and want to force every shader to
# re-compile from bytecode on each run (the cache key is content-hashed
# bytecode, so a stale entry written by a buggy emitter would otherwise
# pin you to the bug across runs).
#
# Default: true
# Supported values: true, false

# shaderCache.enable = true


###########
# Query   #
###########

# Return `S_OK` immediately on `GetData(D3DGETDATA_FLUSH)` for a
# `Pending` occlusion query instead of kernel-blocking on
# `MTLCommandBuffer::waitUntilCompleted`.
#
# D3D9-era games use the FLUSH-poll loop as a poor-man's GPU fence
# to compensate for 2004-era drivers that lacked resource hazard
# tracking. Metal tracks hazards explicitly between command
# buffers, so the fence does no correctness work — it just throttles
# our API thread (the project's bottleneck) while the GPU (which
# has headroom) is given time it doesn't need. Returning `S_OK`
# immediately lets the game proceed; the actual visibility count
# finalizes naturally on the next `begin_frame` intake if it is
# ever read via the non-FLUSH path (e.g. sun/moon lens-flare,
# which uses `flags = 0`).
#
# Flip to `false` to restore the spec-correct kernel wait. Worth
# trying if a game appears to read the actual pixel count
# immediately after FLUSH and depends on it being accurate (no
# tested game does this in practice).
#
# Default: true
# Supported values: true, false

# query.flushImmediate = true


#########
# Depth #
#########

# A newly bound same-size depth-stencil texture inherits the previous
# one's contents.
#
# D3D9-era drivers commonly backed all equal-size depth-stencil
# surfaces with one physical allocation. Engines of that era exploit
# this: render scene depth with one depth texture bound, then bind a
# *different* depth texture of the same size and z-test against it
# while sampling the first (sampling the bound depth-stencil itself is
# forbidden in D3D9). No copy appears anywhere in the API stream; the
# content flows through the shared driver allocation. When enabled,
# binding a texture-backed depth-stencil whose dimensions match the
# previously bound one queues a GPU copy of the previous contents into
# it, reproducing that behavior explicitly.
#
# Leave off for engines that clear every depth target before use (the
# common case): they would pay one full-surface GPU copy per
# depth-target switch for nothing.
#
# Default: false
# Supported values: true, false

# depth.aliasSameSize = false


###########
# Memory  #
###########

# Cap on live VB/IB retained-PageBox memory (MiB).
#
# A non-DYNAMIC partial Lock of an in-flight vertex/index buffer is
# renamed to a fresh backing and the old one retained until the GPU
# stops reading it. During a camera turn the game repacks hundreds of
# buffers per frame; if the GPU falls behind, the retention queue can
# balloon (observed ~1.4 GB) and thrash the 32-bit game process. This
# caps live retained bytes: at the limit the Lock path drains retired
# backings and, if still over, forces a mid-frame GPU-sync before
# allocating — trading a bounded, predictable stall for the unbounded
# memory growth + OOM risk.
#
# Lower it if you still see memory-pressure stalls; raise it if turns
# stall on the GPU-sync more than the memory pressure warrants. `0`
# disables the cap, leaving retention unbounded — nothing else limits
# it, so an exhausted address space aborts the process.
#
# Default: 512
# Supported values: non-negative integer (MiB; 0 = disabled)

# memory.vbibRetentionCapMB = 512

# Ceiling on the video memory GetAvailableTextureMem advertises (MiB).
#
# An engine of this era sizes its texture and streaming pools from what
# that call reports, then commits against the figure. A 32-bit guest runs
# out of process address space long before a unified-memory Mac runs out
# of GPU memory, and what fails at that point is a Metal command buffer,
# out of memory, whose rendering is discarded: geometry and textures go
# missing rather than an allocation returning an error the title could
# handle.
#
# 0 lifts the ceiling. The default caps a 32-bit guest and leaves a
# 64-bit one alone.
#
# Default: 1024 on a 32-bit guest, 0 on 64-bit
# Supported values: non-negative integer (MiB; 0 = no ceiling)

# memory.vramBudgetMB = 1024

# PageBox recycle pool cap (MiB).
#
# Every contended Lock of a DYNAMIC vertex/index buffer allocates a
# fresh 16 KiB-aligned backing and frees the old one a frame later.
# Cycling those through the general allocator lets it return the pages
# to the OS, so the game's first write into each fresh backing pays a
# page fault plus mapping syscalls (expensive under Wine + Rosetta).
# With a non-zero cap, retired backings are instead parked in a
# per-size pool, up to this many MiB, and handed back warm to the next
# same-size Lock. Measured effect of enabling it: ~900 MB/s of backing
# churn stops hitting the allocator and the process fault rate drops
# ~50x. Parked memory stays committed, bounded by this cap; the
# default leaves ~2x headroom over the observed quiet-scene peak
# (53 MiB). `0` disables the pool.
#
# Default: 128
# Supported values: non-negative integer (MiB; 0 = disabled)

# memory.pageboxPoolCapMB = 128


################
# Presentation #
################

# Frame-rate ceiling (Hz).
#
# Caps how often mtld3d presents, independent of the game's vsync
# request. Useful to trade frame rate for battery/thermals, or to
# bound a free-running (vsync-off) game without re-enabling vsync.
# When both this cap and vsync are active, the lower rate wins:
# `present.maxFps = 60` on a 120 Hz panel gives 60 fps with vsync on.
# Values above the panel's refresh rate have no extra effect while
# vsync is on (the panel ceiling still applies). `0` disables the cap.
#
# Default: 0 (uncapped)
# Supported values: non-negative integer (Hz; 0 = uncapped)

# present.maxFps = 0


##############
# Rendering  #
##############

# Render resolution as a fraction of the presented size, MetalFX-upscaled.
#
# `1.0` (the default) renders at full resolution and changes nothing.
# Below that, the scene is rasterized on a smaller grid and MetalFX
# upscales it on the way to the screen: `0.5` renders a quarter of the
# pixels. That trades image detail for frame rate, which is worth it when
# the GPU is the limit. `0.75` is a good first try; `0.5` is noticeably
# soft, because the interface and text are scaled along with the world.
#
# MetalFX is an edge-aware spatial upscaler, so the result is sharper
# than the plain stretch the display would otherwise do.
#
# In fullscreen the display mode picked in the game's own video options sets
# the back-buffer size and this scale multiplies on top: a 1600x900 game
# setting at `0.75` rasterizes 1200x675, upscaled to the screen in one
# MetalFX pass. In a maximized window, and for a fullscreen request that is
# no real display mode, the back buffer follows the window instead, so there
# this scale is the only resolution control.
#
# A render target or depth buffer the game creates at exactly the size it
# was given for the back buffer is treated as part of the same image and
# scales with it, so a game that draws its world into a target of its own
# and blits the result still rasterizes fewer pixels. Targets at other
# sizes (shadow maps, post-process chains) keep the resolution the game
# chose; if the scene lands in one of those, a one-shot warning says so.
#
# Values above `1.0` are not accepted. Rendering more pixels than are
# displayed needs a downscale on present, and the one present has is a
# single bilinear tap, which drops samples instead of averaging them: it
# would cost the GPU time without buying the detail supersampling is for.
#
# Ignored on a GPU without MetalFX support (a one-shot warning says so);
# the render resolution is held at `1.0` there rather than falling back
# to a blurrier scaler than the one you would have had.
#
# Default: 1.0
# Supported values: a number in (0, 1.0]

# render.scale = 1.0


#####################
# Debug diagnostics #
#####################

# Expand capability bits to the spec maximum.
#
# OR-in every `D3DCAPS9_*_ALL` mask so the game requests every feature
# it knows about, surfacing unimplemented paths via `log_once_warn!`
# under `RUST_LOG=mtld3d=warn`. Visual rendering may degrade because
# unimplemented features fall back to stubs — this is for log-side
# discovery, not pixels. Pair with `RUST_LOG=mtld3d::d3d9::state=trace`
# to enumerate every RS/TSS/SAMP write the game makes.
#
# Default: false
# Supported values: true, false

# debug.capsAll = false

# Directory to dump raw DXSO bytecode into.
#
# When non-empty, the first time each shader is compiled mtld3d writes
# `<dir>/{vs,ps}_<hash>.dxso` containing the raw little-endian `u32`
# token stream. The directory is created on first use. Subsequent
# sights of the same shader id are no-ops. Use with the offline
# disassembler in the source tree (`cd windows && cargo run --example
# disasm --target aarch64-apple-darwin -- <dir>/ps_<hash>.dxso`) to
# inspect the bytecode + emitted MSL without re-running the game. The hash
# matches the value the per-pass debug log prints as `VS prog 0xN` /
# `PS prog 0xN`.
#
# Default: "" (disabled)
# Supported values: any directory path; empty disables

# debug.bytecodeDumpDir = ""

# Shader-identity bisection probe — drop draws whose VS or PS matches.
#
# Comma-separated list of `pair_id().hash` u64s in hex (with or
# without the `0x` prefix). Any draw whose VS hash *or* PS hash
# appears in the list is dropped on the encoder thread before
# Metal encoding. Stable across frames (unlike index-based skip),
# so this is the right tool when draw counts vary frame-to-frame.
# Get the hashes from the per-pass debug log lines
# (`RUST_LOG=mtld3d::d3d9=debug`).
#
# Default: "" (no draws skipped)
# Supported values: comma-separated hex u64s, e.g. "0xabc, 0xdef"

# debug.skipShaders = ""

# Report the adapter as a well-known GPU vendor.
#
# D3D9-era engines choose vendor-specific render paths (depth copies
# via StretchRect on one vendor, a resolve hack on another) and turn
# those paths off entirely for a vendor they do not recognize, which
# leaves depth-dependent effects (light glows, lens flares) reading a
# buffer nothing updates. The spoof presents a consistent identity in
# GetAdapterIdentifier: vendor id, device id, marketing description,
# driver DLL name and driver version.
#
# Default: none (report the real identity)
# Supported values: none | nvidia | amd

# adapter.spoof = none

# Advertise the DF24 / DF16 sampleable-depth formats.
#
# These fourccs existed on one vendor's hardware. An engine that
# probes them next to INTZ and finds both available can take a mixed
# depth path no real GPU ever ran; setting this to false hides the DF
# formats from CheckDeviceFormat (INTZ stays advertised).
#
# Default: true
# Supported values: true | false

# caps.dfFormats = true
